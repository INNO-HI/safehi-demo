openapi: 3.0.3
info:
  title: SafeHi 인증 API
  description: SafeHi 돌봄 관리 시스템 인증 관련 API
  version: 1.0.0

servers:
  - url: /api
    description: API 서버

paths:
  /auth/login:
    post:
      summary: 로그인
      description: 이메일과 비밀번호로 로그인합니다.
      operationId: login
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '423':
          description: 계정 잠금
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLockedResponse'

  /auth/register:
    post:
      summary: 회원가입
      description: 새로운 사용자 계정을 생성합니다.
      operationId: register
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: 유효성 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '409':
          description: 이메일 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/email/send-code:
    post:
      summary: 이메일 인증 코드 발송
      description: 회원가입 시 이메일 인증 코드를 발송합니다.
      operationId: sendEmailCode
      tags:
        - Email Verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailCodeRequest'
      responses:
        '200':
          description: 인증 코드 발송 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '429':
          description: 요청 제한 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/email/verify-code:
    post:
      summary: 이메일 인증 코드 확인
      description: 발송된 인증 코드를 확인합니다.
      operationId: verifyEmailCode
      tags:
        - Email Verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailCodeRequest'
      responses:
        '200':
          description: 인증 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 인증 실패 (잘못된 코드 또는 만료)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/password/forgot:
    post:
      summary: 비밀번호 재설정 링크 발송
      description: 비밀번호 재설정 링크를 이메일로 발송합니다.
      operationId: forgotPassword
      tags:
        - Password Reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: 재설정 링크 발송 완료 (이메일 존재 여부와 관계없이 동일 응답)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/password/reset:
    post:
      summary: 비밀번호 재설정
      description: 토큰을 사용하여 새 비밀번호를 설정합니다.
      operationId: resetPassword
      tags:
        - Password Reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: 비밀번호 재설정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: 유효하지 않거나 만료된 토큰
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/check-email:
    get:
      summary: 이메일 중복 확인
      description: 이메일이 이미 등록되어 있는지 확인합니다.
      operationId: checkEmail
      tags:
        - Validation
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: 확인 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailCheckResponse'

  /regions:
    get:
      summary: 시/도 목록 조회
      description: 모든 시/도 목록을 조회합니다.
      operationId: getRegions
      tags:
        - Region
      responses:
        '200':
          description: 시/도 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Region'

  /regions/{regionId}/districts:
    get:
      summary: 구/군 목록 조회
      description: 특정 시/도의 구/군 목록을 조회합니다.
      operationId: getDistricts
      tags:
        - Region
      parameters:
        - name: regionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 구/군 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/District'
        '404':
          description: 시/도를 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /districts/{districtId}/organizations:
    get:
      summary: 기관 목록 조회
      description: 특정 구/군의 기관 목록을 조회합니다.
      operationId: getOrganizations
      tags:
        - Organization
      parameters:
        - name: districtId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 기관 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
        '404':
          description: 구/군을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /organization-membership:
    post:
      summary: 기관 인증 요청
      description: 기관 소속 인증을 요청합니다.
      operationId: requestOrganizationMembership
      tags:
        - Organization Membership
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OrganizationMembershipRequest'
      responses:
        '201':
          description: 인증 요청 제출 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMembershipResponse'
        '401':
          description: 인증되지 않은 사용자
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 이미 진행 중인 인증 요청이 있음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Request Schemas
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: test@example.com
        password:
          type: string
          format: password
          example: Test1234!
        rememberMe:
          type: boolean
          default: false

    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
        - phone
        - agreeTerms
        - agreePrivacy
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 50
          example: 홍길동
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: 8자 이상, 특수문자 1개 이상, 숫자 1개 이상
          example: MyPass123!
        phone:
          type: string
          pattern: '^010-\d{4}-\d{4}$'
          example: '010-1234-5678'
        agreeTerms:
          type: boolean
          description: 이용약관 동의
        agreePrivacy:
          type: boolean
          description: 개인정보 처리방침 동의

    SendEmailCodeRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com

    VerifyEmailCodeRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        code:
          type: string
          pattern: '^\d{6}$'
          example: '123456'

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: user@example.com

    ResetPasswordRequest:
      type: object
      required:
        - token
        - password
      properties:
        token:
          type: string
          description: 비밀번호 재설정 토큰
        password:
          type: string
          format: password
          minLength: 8
          description: 새 비밀번호

    OrganizationMembershipRequest:
      type: object
      required:
        - organizationId
      properties:
        organizationId:
          type: string
          description: 소속 기관 ID
        document:
          type: string
          format: binary
          description: 직원 증빙 서류 (PDF, JPG, PNG, 최대 10MB)
        memo:
          type: string
          maxLength: 500
          description: 기타 메모

    # Response Schemas
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
        accessToken:
          type: string
          description: JWT 액세스 토큰

    RegisterResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          example: 회원가입이 완료되었습니다.
        user:
          $ref: '#/components/schemas/User'

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          description: 오류 메시지
        code:
          type: string
          description: 오류 코드

    ValidationErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    AccountLockedResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: 계정이 잠겼습니다. 30분 후 다시 시도해주세요.
        lockedUntil:
          type: string
          format: date-time

    EmailCheckResponse:
      type: object
      properties:
        available:
          type: boolean
          description: true면 사용 가능, false면 이미 등록됨

    OrganizationMembershipResponse:
      type: object
      properties:
        success:
          type: boolean
        membership:
          $ref: '#/components/schemas/OrganizationMembership'
        message:
          type: string
          example: 기관 인증 요청이 제출되었습니다. 관리자 승인까지 1~2 영업일 소요됩니다.

    # Entity Schemas
    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          type: string
          enum: [user, manager, admin]
        emailVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Region:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: 서울특별시
        code:
          type: string
          example: '11'

    District:
      type: object
      properties:
        id:
          type: string
        regionId:
          type: string
        name:
          type: string
          example: 양천구
        code:
          type: string
          example: '11150'

    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: 목동종합사회복지관
        districtId:
          type: string
        address:
          type: string

    OrganizationMembership:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        organizationId:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        documentUrl:
          type: string
        memo:
          type: string
        requestedAt:
          type: string
          format: date-time
        approvedAt:
          type: string
          format: date-time
        rejectedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
