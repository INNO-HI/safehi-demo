openapi: 3.0.3
info:
  title: SafeHi Admin Dashboard API
  description: |
    관리자 대시보드를 위한 API 명세

    **현재 상태**: Mock 데이터 사용 (프론트엔드 전용)
    **참고**: 이 명세는 추후 백엔드 구현 시 참고용으로, 현재는 Mock 함수로 구현
  version: 1.0.0
  contact:
    name: SafeHi Development Team

servers:
  - url: /api/v1
    description: API Base URL

tags:
  - name: Dashboard
    description: 대시보드 홈 관련 API
  - name: CareLogs
    description: 돌봄 일지 관련 API
  - name: Recipients
    description: 대상자 관리 관련 API

paths:
  /dashboard/kpi:
    get:
      tags:
        - Dashboard
      summary: 대시보드 KPI 조회
      description: 오늘 방문, 대기중 보고서, 승인 완료, 담당 대상자 KPI 데이터 조회
      operationId: getDashboardKPI
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardKPIResponse'

  /dashboard/recent-reports:
    get:
      tags:
        - Dashboard
      summary: 최근 보고서 조회
      description: 대시보드에 표시할 최근 보고서 5건 조회
      operationId: getRecentReports
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentReportsResponse'

  /dashboard/notifications:
    get:
      tags:
        - Dashboard
      summary: 알림 목록 조회
      description: 대시보드에 표시할 알림 목록 조회
      operationId: getNotifications
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 4
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsResponse'

  /care-logs:
    get:
      tags:
        - CareLogs
      summary: 돌봄 일지 목록 조회
      description: 필터링 및 페이지네이션이 적용된 돌봄 일지 목록 조회
      operationId: getCareLogs
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, urgent, approved, rejected]
            default: all
        - name: q
          in: query
          description: 검색어 (대상자명, 종사자명, 센터명)
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: dong
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CareLogsResponse'

  /care-logs/status-counts:
    get:
      tags:
        - CareLogs
      summary: 상태별 건수 조회
      description: 전체/대기중/긴급/승인/반려 건수 조회
      operationId: getCareLogStatusCounts
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusCountsResponse'

  /care-logs/bulk-approve:
    post:
      tags:
        - CareLogs
      summary: 일괄 승인
      description: 선택된 보고서들을 일괄 승인 처리
      operationId: bulkApproveCareLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkActionRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkActionResponse'

  /care-logs/bulk-reject:
    post:
      tags:
        - CareLogs
      summary: 일괄 반려
      description: 선택된 보고서들을 일괄 반려 처리
      operationId: bulkRejectCareLogs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkActionRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkActionResponse'

  /recipients:
    get:
      tags:
        - Recipients
      summary: 대상자 목록 조회
      description: 필터링 및 페이지네이션이 적용된 대상자 목록 조회
      operationId: getRecipients
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, normal, caution, urgent, unvisited]
            default: all
        - name: q
          in: query
          description: 검색어 (이름, 주소)
          schema:
            type: string
        - name: dong
          in: query
          schema:
            type: string
        - name: manager
          in: query
          description: 담당 매니저 ID
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientsResponse'

  /recipients/kpi:
    get:
      tags:
        - Recipients
      summary: 대상자 KPI 조회
      description: 전체/이번주방문/긴급/주의/미방문 KPI 조회
      operationId: getRecipientKPI
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientKPIResponse'

  /recipients/status-counts:
    get:
      tags:
        - Recipients
      summary: 상태별 인원수 조회
      description: 전체/정상/주의/긴급/미방문 인원수 조회
      operationId: getRecipientStatusCounts
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusCountsResponse'

  /recipients/export:
    get:
      tags:
        - Recipients
      summary: 대상자 목록 내보내기
      description: |
        현재 필터가 적용된 대상자 목록을 Excel 파일로 내보내기
        **참고**: 프론트엔드에서 클라이언트 사이드로 처리
      operationId: exportRecipients
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: q
          in: query
          schema:
            type: string
        - name: dong
          in: query
          schema:
            type: string
        - name: manager
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 성공 (Excel 파일 반환)
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

components:
  schemas:
    KPICard:
      type: object
      properties:
        title:
          type: string
        value:
          type: integer
        change:
          type: integer
        changeDirection:
          type: string
          enum: [up, down, none]
        progressColor:
          type: string
          enum: [blue, yellow, purple, green]
        progressPercent:
          type: integer

    DashboardKPIResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            todayVisits:
              $ref: '#/components/schemas/KPICard'
            pendingReports:
              $ref: '#/components/schemas/KPICard'
            approvedCount:
              $ref: '#/components/schemas/KPICard'
            totalRecipients:
              $ref: '#/components/schemas/KPICard'
            lastUpdated:
              type: string
              format: date-time

    RecentReport:
      type: object
      properties:
        id:
          type: string
        recipientName:
          type: string
        managerName:
          type: string
        registeredAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, urgent, approved, rejected]
        isUrgent:
          type: boolean

    RecentReportsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/RecentReport'

    Notification:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        isUrgent:
          type: boolean
        link:
          type: string
        icon:
          type: string
          enum: [warning, info, success, report]

    NotificationsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Notification'
            totalCount:
              type: integer

    CareLog:
      type: object
      properties:
        id:
          type: string
        recipientName:
          type: string
        managerName:
          type: string
        centerName:
          type: string
        visitDate:
          type: string
          format: date-time
        registeredAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, urgent, approved, rejected]

    CareLogsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CareLog'
            pagination:
              $ref: '#/components/schemas/Pagination'
            totalCount:
              type: integer

    Recipient:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        age:
          type: integer
        gender:
          type: string
          enum: [male, female]
        dong:
          type: string
        address:
          type: string
        managerName:
          type: string
        lastVisitDate:
          type: string
          format: date
          nullable: true
        visitCount:
          type: integer
        status:
          type: string
          enum: [normal, caution, urgent, unvisited]

    RecipientsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Recipient'
            pagination:
              $ref: '#/components/schemas/Pagination'
            totalCount:
              type: integer

    RecipientKPIResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            totalRecipients:
              $ref: '#/components/schemas/KPICard'
            weeklyVisits:
              $ref: '#/components/schemas/KPICard'
            urgentCases:
              $ref: '#/components/schemas/KPICard'
            cautionCases:
              $ref: '#/components/schemas/KPICard'
            unvisitedCases:
              $ref: '#/components/schemas/KPICard'

    StatusCountsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          additionalProperties:
            type: integer
          example:
            all: 42
            pending: 8
            urgent: 2
            approved: 28
            rejected: 4

    Pagination:
      type: object
      properties:
        currentPage:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    BulkActionRequest:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            type: string

    BulkActionResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            updatedCount:
              type: integer
            updatedIds:
              type: array
              items:
                type: string
