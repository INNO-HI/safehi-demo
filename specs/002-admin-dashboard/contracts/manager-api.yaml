openapi: 3.0.3
info:
  title: SafeHi Manager Management API
  description: 매니저 관리 페이지 API 계약 (Mock 데이터 기반)
  version: 1.0.0

servers:
  - url: /api/admin
    description: Admin API

paths:
  /managers:
    get:
      summary: 매니저 목록 조회
      description: 필터링/페이지네이션 적용된 매니저 목록 반환
      operationId: getManagers
      tags:
        - Managers
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, active, leave, retired]
            default: all
        - name: search
          in: query
          schema:
            type: string
          description: 매니저 이름 검색
        - name: dong
          in: query
          schema:
            type: string
          description: 담당 동 필터
        - name: center
          in: query
          schema:
            type: string
          description: 소속 센터 필터
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            enum: [10, 20, 50, 100]
            default: 10
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerListResponse'

  /managers/kpis:
    get:
      summary: 매니저 KPI 조회
      operationId: getManagerKPIs
      tags:
        - Managers
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerKPIs'

  /managers/{id}:
    get:
      summary: 매니저 상세 조회
      operationId: getManagerDetail
      tags:
        - Managers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerDetail'
        '404':
          description: 매니저를 찾을 수 없음

  /managers/{id}/reports:
    get:
      summary: 매니저별 보고서 목록 조회
      operationId: getManagerReports
      tags:
        - Managers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [all, pending, approved, rejected]
            default: all
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerReportListResponse'

  /managers/{id}/visits:
    get:
      summary: 매니저별 방문 기록 목록 조회
      operationId: getManagerVisits
      tags:
        - Managers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: visitType
          in: query
          schema:
            type: string
            enum: [all, regular, emergency, call]
            default: all
        - name: search
          in: query
          schema:
            type: string
          description: 대상자명 검색
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagerVisitListResponse'

  /managers/export:
    get:
      summary: 매니저 목록 Excel 내보내기
      operationId: exportManagers
      tags:
        - Managers
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, active, leave, retired]
        - name: dong
          in: query
          schema:
            type: string
        - name: center
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Excel 파일 다운로드
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

components:
  schemas:
    ManagerStatus:
      type: string
      enum: [active, leave, retired]

    ManagerVisitType:
      type: string
      enum: [regular, emergency, call]

    ReportStatus:
      type: string
      enum: [pending, approved, rejected]

    Manager:
      type: object
      required:
        - id
        - name
        - gender
        - centerName
        - phone
        - assignedDongs
        - recipientCount
        - monthlyVisits
        - status
      properties:
        id:
          type: string
          example: mgr-0001
        name:
          type: string
          example: 김민수
        gender:
          type: string
          enum: [male, female]
        centerName:
          type: string
          example: 목동종합사회복지관
        phone:
          type: string
          example: 010-1234-5678
        assignedDongs:
          type: array
          items:
            type: string
          example: ['목동 1동', '목동 2동']
        recipientCount:
          type: integer
          example: 15
        monthlyVisits:
          type: integer
          example: 42
        status:
          $ref: '#/components/schemas/ManagerStatus'

    ManagerDetail:
      allOf:
        - $ref: '#/components/schemas/Manager'
        - type: object
          required:
            - email
            - startDate
            - stats
            - recentReports
            - recentVisits
          properties:
            email:
              type: string
              format: email
            startDate:
              type: string
              format: date
            stats:
              type: object
              properties:
                monthlyVisits:
                  type: integer
                monthlyReports:
                  type: integer
                approvalRate:
                  type: integer
                  minimum: 0
                  maximum: 100
                totalRecipients:
                  type: integer
            recentReports:
              type: array
              items:
                $ref: '#/components/schemas/ManagerReport'
              maxItems: 5
            recentVisits:
              type: array
              items:
                $ref: '#/components/schemas/ManagerVisit'
              maxItems: 5

    ManagerReport:
      type: object
      required:
        - id
        - recipientId
        - recipientName
        - visitDate
        - registeredAt
        - status
      properties:
        id:
          type: string
        recipientId:
          type: string
        recipientName:
          type: string
        visitDate:
          type: string
          format: date-time
        registeredAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/ReportStatus'

    ManagerVisit:
      type: object
      required:
        - id
        - recipientId
        - recipientName
        - visitDate
        - visitType
        - result
      properties:
        id:
          type: string
        recipientId:
          type: string
        recipientName:
          type: string
        visitDate:
          type: string
          format: date-time
        visitType:
          $ref: '#/components/schemas/ManagerVisitType'
        result:
          type: string

    ManagerKPIs:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        leave:
          type: integer
        retired:
          type: integer

    ManagerListResponse:
      type: object
      properties:
        managers:
          type: array
          items:
            $ref: '#/components/schemas/Manager'
        totalCount:
          type: integer
        statusCounts:
          type: object
          properties:
            all:
              type: integer
            active:
              type: integer
            leave:
              type: integer
            retired:
              type: integer

    ManagerReportListResponse:
      type: object
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/ManagerReport'
        totalCount:
          type: integer
        statusCounts:
          type: object

    ManagerVisitListResponse:
      type: object
      properties:
        visits:
          type: array
          items:
            $ref: '#/components/schemas/ManagerVisit'
        totalCount:
          type: integer
        typeCounts:
          type: object
